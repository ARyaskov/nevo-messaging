name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint, build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      # Also builds the DevTools UI bundle — `build` runs `build:devtools-ui`.
      - name: Type-check
        run: pnpm build

      # esbuild strips types without checking them, so the browser bundle needs
      # its own gate; `pnpm build` would happily emit a broken dashboard.
      - name: Type-check DevTools UI
        run: pnpm typecheck:devtools-ui

      - name: Tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules
