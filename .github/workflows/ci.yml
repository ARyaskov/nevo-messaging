name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly run surfaces newly disclosed advisories even when nothing is pushed.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs; the trailing comment names the tag.
jobs:
  lint-build-test:
    name: Lint, build and test (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
        # The lockfile pins Nest 12; the 11 leg swaps in the newest 11.x to keep
        # the `^11 || ^12` peer range honest.
        nest: ["11", "12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Version comes from the root package.json `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Use Nest.js 11
        if: matrix.nest == '11'
        run: >-
          pnpm add -D
          @nestjs/common@^11 @nestjs/core@^11 @nestjs/microservices@^11
          @nestjs/platform-fastify@^11 @nestjs/config@^4

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      # Also builds the DevTools UI bundle — `build` runs `build:devtools-ui`.
      - name: Type-check
        run: pnpm build

      # esbuild strips types without checking them, so the browser bundle needs
      # its own gate; `pnpm build` would happily emit a broken dashboard.
      - name: Type-check DevTools UI
        run: pnpm typecheck:devtools-ui

      - name: Tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules

      # Boots a Nest app on the built dist/ from a CommonJS and an ESM consumer;
      # on Nest 12 (ESM-only) this exercises require(esm) and module identity.
      - name: Consumer smoke test
        run: |
          node scripts/smoke/consumer.cjs
          node scripts/smoke/consumer.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI is used directly (not gitleaks-action) so no licence key is needed,
      # and the tarball is checksum-verified before it runs.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif .

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  dependency-audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Accepted exceptions live in pnpm-workspace.yaml `auditConfig.ignoreGhsas`, each with a reason.
      - name: Audit full dependency tree
        run: pnpm audit --audit-level=moderate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
