allowBuilds:
  '@nestjs/core': true
  esbuild: true
  protobufjs: false

# Moved from .npmrc, which pnpm 11+ no longer reads for these settings.
# Prerelease Node versions (nightlies) don't satisfy plain `engines.node` ranges.
engineStrict: false
# Optional peers must not block install. Peers are auto-installed (pnpm default),
# which the lockfile and tests rely on.
strictPeerDependencies: false

# Supply-chain hardening: skip versions published less than a day ago, refuse
# git/tarball transitive deps, and fail when a package loses its provenance.
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade

# Floors for vulnerable transitive deps (see `pnpm audit`). Ranges are scoped so
# only affected majors are rewritten.
overrides:
  '@grpc/grpc-js@>=1.14.0 <1.14.5': ^1.14.5
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  engine.io@>=6.6.0 <6.6.10: ^6.6.10
  fast-copy@>=3.0.0 <3.1.0: ^3.1.0
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  fastify@>=5.0.0 <5.12.5: ^5.12.5
  find-my-way@>=9.0.0 <9.6.1: ^9.6.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  lodash@<4.17.24: ^4.17.24
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  protobufjs@>=7.5.0 <7.6.5: ^7.6.5
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  ws@>=8.0.0 <8.21.0: ^8.21.0

auditConfig:
  ignoreGhsas:
    # uuid <11.1.1 via jaeger-client (unmaintained, pinned to uuid@8): the bug is in
    # v3/v5/v6 with a caller-supplied buffer; jaeger-client only calls v4().
    - GHSA-w5hq-g745-h8pq
